name: Publish to Forgejo Package Registry

permissions:
  contents: read

on:
  push:
    tags:
      - 'v*'

# Pinned so the cache step and bun agree on one folder, whatever HOME the runner image sets.
env:
  BUN_INSTALL_CACHE_DIR: /tmp/bun-cache

jobs:
  publish:
    runs-on: alpine
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      # A lockfile change still restores the closest older cache, so bun only fetches the packages that moved.
      - name: Cache bun packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ env.BUN_INSTALL_CACHE_DIR }}
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock', 'bench/apps/*/bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      # The checks below are skipped once the Tests workflow, which makes them all, passed this tree: on the tagged commit itself when code commits were pushed with it, as the runner takes one job at a time and ran Tests first, or on its parent when the tagged commit only changes the versions: those of kay and its libraries, their peer on kay and the lockfile recording them. Anything else, or a status that cannot be read, runs them all.
      - name: Find whether this tree was already tested
        id: tested
        run: |
          versions_only() {
            for manifest in package.json packages/*/package.json; do
              [ "$(git show "HEAD^:$manifest" | jq -S "del(.version, .peerDependencies.kay)")" = "$(jq -S "del(.version, .peerDependencies.kay)" "$manifest")" ] || return 1
            done
            # bun.lock records each workspace's version and peer on kay, and nothing else may move.
            ! git diff -U0 HEAD^ HEAD -- bun.lock | grep '^[-+]' | grep -v '^\(+++\|---\) ' | grep -qv '^[-+] *"\(version\|kay\)": "[^"]*",\?$'
          }
          verdict() {
            curl -sf -H "Authorization: token $TOKEN" "$API/repos/$GITHUB_REPOSITORY/commits/$1/status" | jq -r '[.statuses[]? | select(.context | startswith("Tests /")) | .status // .state] | first // empty' || true
          }
          tested=false
          own=$(verdict "$(git rev-parse HEAD)")
          echo "The Tests workflow on this commit: ${own:-none}"
          if [ "$own" = success ]; then
            tested=true
          elif git diff --quiet HEAD^ HEAD -- . ":(exclude)package.json" ":(exclude,glob)packages/*/package.json" ":(exclude)bun.lock" && versions_only; then
            parent=$(verdict "$(git rev-parse HEAD^)")
            echo "The Tests workflow on its parent: ${parent:-none}"
            [ "$parent" = success ] && tested=true
          fi
          echo "tested=$tested" >> "$GITHUB_OUTPUT"
        env:
          API: ${{ github.server_url }}/api/v1
          TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install project deps
        run: bun install --silent --frozen-lockfile

      # The benchmark apps are packages of their own, which the type-aware lint reads too.
      - name: Install the benchmark apps' deps
        if: steps.tested.outputs.tested != 'true'
        run: |
          bun install --silent --frozen-lockfile --cwd bench/apps/solid
          bun install --silent --frozen-lockfile --cwd bench/apps/svelte

      # A tag that fails its own checks never reaches the registry.
      - name: Lint
        if: steps.tested.outputs.tested != 'true'
        run: bun run lint

      - name: Check
        if: steps.tested.outputs.tested != 'true'
        run: bun run check

      # The browser suites fail rather than skip under CI without one, as in the Tests workflow.
      - name: Install Chromium
        if: steps.tested.outputs.tested != 'true'
        run: |
          apk info -e chromium ttf-freefont >/dev/null || apk add --no-cache chromium ttf-freefont
          echo "BUN_CHROME_PATH=$(command -v chromium || command -v chromium-browser)" >> "$GITHUB_ENV"

      # The app template's own tests need a Postgres under CI, started as in the Tests workflow.
      - name: Start PostgreSQL
        if: steps.tested.outputs.tested != 'true'
        run: |
          mkdir -p /run/postgresql
          chown postgres:postgres /run/postgresql
          su postgres -c "pg_ctl -D /var/lib/postgresql/data -o '-c listen_addresses=127.0.0.1 -c unix_socket_directories=/run/postgresql' -w start"
          su postgres -c "psql -c \"CREATE USER test WITH PASSWORD 'test' SUPERUSER;\""
          echo "TEST_DATABASE_URL=postgres://test:test@127.0.0.1:5432/kay_app_test" >> "$GITHUB_ENV"
          su postgres -c "createdb -O test kayjs_auth_test"
          echo "KAYJS_AUTH_TEST_DATABASE_URL=postgres://test:test@127.0.0.1:5432/kayjs_auth_test" >> "$GITHUB_ENV"

      - name: Tests
        if: steps.tested.outputs.tested != 'true'
        run: bun run test

      - name: Check and test the libraries
        if: steps.tested.outputs.tested != 'true'
        run: |
          for dir in packages/*/; do
            echo "$dir"
            (cd "$dir" && bun run check && bun run test) || exit 1
          done
        env:
          KAYJS_AUTH_REQUIRE_DATABASE: '1'

      # prepack writes what the exports point at: the declarations under types/ and the Node build of kay/eslint under dist/. Each library publishes at kay's version, its `workspace:` ranges written as that version; one marked private is not released yet.
      # The token lives in ~/.npmrc for this step alone, so no later step, nor what it downloads, can publish with it.
      - name: Publish to Forgejo npm registry
        run: |
          trap 'rm -f ~/.npmrc' EXIT
          echo "@kaynooo:registry=https://git.kaynooo.fr/api/packages/kaynooo/npm/" > ~/.npmrc
          echo "//git.kaynooo.fr/api/packages/kaynooo/npm/:_authToken=${PACKAGE_TOKEN}" >> ~/.npmrc
          # A package already on the registry at this version is skipped, so a rerun after a partial failure publishes the rest.
          publish() {
            package="$(jq -r '.name + "@" + .version' package.json)"
            if bun pm view "$package" version > /dev/null 2>&1; then
              echo "$package is already published"
            else
              bun publish --access public
            fi
          }
          publish
          for dir in packages/*/; do
            [ "$(jq -r '.private // false' "$dir/package.json")" = true ] || (cd "$dir" && publish) || exit 1
          done
        env:
          PACKAGE_TOKEN: ${{ secrets.PACKAGE_TOKEN }}

      # bun x in CI resolves the scope from npmjs, which holds an old changelogitea, unless ~/.npmrc points it at Forgejo; no token needed to read.
      - name: Generate changelog
        run: |
          echo "@kaynooo:registry=https://git.kaynooo.fr/api/packages/kaynooo/npm/" > ~/.npmrc
          bun x @kaynooo/changelogitea@1.6.5
        env:
          GITHUB_TOKEN: ${{secrets.GITHUB_TOKEN}}
