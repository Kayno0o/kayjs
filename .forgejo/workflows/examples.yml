name: Examples

# Daily, so a pg-orm release that breaks the examples with kay shows here before a site meets it, kay commit or not; kay's own libraries are its packages/, tested on every push.
on:
  schedule:
    - cron: '17 5 * * *'
  workflow_dispatch:

# Pinned so the cache step and bun agree on one folder, whatever HOME the runner image sets.
env:
  BUN_INSTALL_CACHE_DIR: /tmp/bun-cache

jobs:
  examples:
    runs-on: alpine
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Cache bun packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ env.BUN_INSTALL_CACHE_DIR }}
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock', 'bench/apps/*/bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - name: Install dependencies
        run: bun install --silent --frozen-lockfile

      # For the examples' tests driving pages in a real browser, which Bun.WebView finds through BUN_CHROME_PATH.
      - name: Install Chromium
        run: |
          apk info -e chromium ttf-freefont >/dev/null || apk add --no-cache chromium ttf-freefont
          echo "BUN_CHROME_PATH=$(command -v chromium || command -v chromium-browser)" >> "$GITHUB_ENV"

      # The examples' own tests copy a database per test file, here on the cluster the runner image holds, started as pg-orm's CI starts it.
      - name: Start PostgreSQL
        run: |
          mkdir -p /run/postgresql
          chown postgres:postgres /run/postgresql
          su postgres -c "pg_ctl -D /var/lib/postgresql/data -o '-c listen_addresses=127.0.0.1 -c unix_socket_directories=/run/postgresql' -w start"
          su postgres -c "psql -c \"CREATE USER test WITH PASSWORD 'test' SUPERUSER;\""
          echo "TEST_DATABASE_URL=postgres://test:test@127.0.0.1:5432/kay_app_test" >> "$GITHUB_ENV"

      - name: Test the examples on the latest pg-orm release
        run: |
          bun update --latest @kaynooo/pg-orm
          bun test ./tests/examples.test.ts
