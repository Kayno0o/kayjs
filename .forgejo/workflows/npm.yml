name: Publish to Forgejo Package Registry

permissions:
  contents: read

on:
  push:
    tags:
      - 'v*'

# Pinned so the cache step and bun agree on one folder, whatever HOME the runner image sets.
env:
  BUN_INSTALL_CACHE_DIR: /tmp/bun-cache

jobs:
  publish:
    runs-on: alpine
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # A lockfile change still restores the closest older cache, so bun only fetches the packages that moved.
      - name: Cache bun packages
        uses: actions/cache@v4
        with:
          path: ${{ env.BUN_INSTALL_CACHE_DIR }}
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock', 'bench/apps/*/bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      # A tag on a version commit alone, over a parent the Tests workflow passed, skips the checks below, which that run already made on the same tree. Anything else, or a status that cannot be read, runs them all.
      - name: Find whether this tree was already tested
        id: tested
        run: |
          tested=false
          if git diff --quiet HEAD^ HEAD -- . ":!package.json" && [ "$(git show HEAD^:package.json | jq -S "del(.version)")" = "$(jq -S "del(.version)" package.json)" ]; then
            state=$(curl -sf -H "Authorization: token $TOKEN" "$API/repos/$GITHUB_REPOSITORY/commits/$(git rev-parse HEAD^)/status" | jq -r .state || true)
            echo "The parent commit's status: ${state:-unreadable}"
            [ "$state" = success ] && tested=true
          fi
          echo "tested=$tested" >> "$GITHUB_OUTPUT"
        env:
          API: ${{ github.server_url }}/api/v1
          TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install project deps
        run: bun install --silent --frozen-lockfile

      # The benchmark apps are packages of their own, which the type-aware lint reads too.
      - name: Install the benchmark apps' deps
        if: steps.tested.outputs.tested != 'true'
        run: |
          bun install --silent --frozen-lockfile --cwd bench/apps/solid
          bun install --silent --frozen-lockfile --cwd bench/apps/svelte

      # A tag that fails its own checks never reaches the registry.
      - name: Lint
        if: steps.tested.outputs.tested != 'true'
        run: bun run lint

      - name: Check
        if: steps.tested.outputs.tested != 'true'
        run: bun run check

      # The browser suites fail rather than skip under CI without one, as in the Tests workflow.
      - name: Install Chromium
        if: steps.tested.outputs.tested != 'true'
        run: |
          apk add --no-cache chromium ttf-freefont
          echo "BUN_CHROME_PATH=$(command -v chromium || command -v chromium-browser)" >> "$GITHUB_ENV"

      # The app template's own tests need a Postgres under CI, started as in the Tests workflow.
      - name: Start PostgreSQL
        if: steps.tested.outputs.tested != 'true'
        run: |
          mkdir -p /run/postgresql
          chown postgres:postgres /run/postgresql
          su postgres -c "pg_ctl -D /var/lib/postgresql/data -o '-c listen_addresses=127.0.0.1 -c unix_socket_directories=/run/postgresql' -w start"
          su postgres -c "psql -c \"CREATE USER test WITH PASSWORD 'test' SUPERUSER;\""
          echo "TEST_DATABASE_URL=postgres://test:test@127.0.0.1:5432/kay_app_test" >> "$GITHUB_ENV"

      - name: Tests
        if: steps.tested.outputs.tested != 'true'
        run: bun tests/shards.ts 3

      - name: Configure npm authentication
        run: |
          echo "@kaynooo:registry=https://git.kaynooo.fr/api/packages/kaynooo/npm/" > ~/.npmrc
          echo "//git.kaynooo.fr/api/packages/kaynooo/npm/:_authToken=${PACKAGE_TOKEN}" >> ~/.npmrc
        env:
          PACKAGE_TOKEN: ${{ secrets.PACKAGE_TOKEN }}

      # prepack writes what the exports point at: the declarations under types/ and the Node build of kay/eslint under dist/.
      - name: Publish to Forgejo npm registry
        run: bun publish --access public
        env:
          PACKAGE_TOKEN: ${{ secrets.PACKAGE_TOKEN }}

      - name: Generate changelog
        run: bun x @kaynooo/changelogitea@latest
        env:
          GITHUB_TOKEN: ${{secrets.GITHUB_TOKEN}}
