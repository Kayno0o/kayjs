name: Tests

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
  pull_request:
    paths-ignore:
      - '**.md'
  workflow_dispatch:

# Pinned so the cache step and bun agree on one folder, whatever HOME the runner image sets.
env:
  BUN_INSTALL_CACHE_DIR: /tmp/bun-cache

jobs:
  test:
    # Solid 2's compiler ships no musl binary and its WASI fallback fails under Bun, so not alpine.
    runs-on: debian
    timeout-minutes: 15

    steps:
      - name: Install checkout and setup-bun tools
        run: apt-get update && apt-get install -y unzip git

      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      # A lockfile change still restores the closest older cache, so bun only fetches the packages that moved.
      - name: Cache bun packages
        uses: actions/cache@v4
        with:
          path: ${{ env.BUN_INSTALL_CACHE_DIR }}
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - name: Install dependencies
        run: bun install --silent --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Check
        run: bun run check

      - name: Tests
        run: bun test

      # The Solid and Svelte apps the benchmark compares against are packages of their own.
      - name: Check the benchmark apps
        run: |
          bun install --silent --frozen-lockfile --cwd bench/apps/solid
          bun install --silent --frozen-lockfile --cwd bench/apps/svelte
          bun run bench:check
