name: Publish to the npm registries

permissions:
  contents: read

on:
  push:
    tags:
      - 'v*'

env:
  BUN_INSTALL_CACHE_DIR: /tmp/bun-cache
  CI: 'true'

jobs:
  publish:
    runs-on: alpine
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Check the tag is on v2 or main
        run: |
          if git merge-base --is-ancestor "$GITHUB_SHA" origin/v2 2>/dev/null || git merge-base --is-ancestor "$GITHUB_SHA" origin/main 2>/dev/null; then
            echo "Tag $GITHUB_REF_NAME is on a release branch"
          else
            echo "$GITHUB_SHA is not on v2 or main, nothing is published"
            exit 1
          fi

      - name: Install GNU tar & jq
        run: apk info -e tar jq >/dev/null || apk add --no-cache tar jq

      - name: Cache bun packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ env.BUN_INSTALL_CACHE_DIR }}
          key: bun-v2-${{ runner.os }}-${{ hashFiles('bun.lock', 'docs/bun.lock') }}
          restore-keys: bun-v2-${{ runner.os }}-

      - name: Install project deps
        run: bun install --silent --frozen-lockfile

      - name: Install Chromium & ImageMagick
        run: |
          apk add --no-cache chromium ttf-freefont imagemagick imagemagick-webp imagemagick-heic imagemagick-svg
          echo "BUN_CHROME_PATH=$(command -v chromium || command -v chromium-browser)" >> "$GITHUB_ENV"

      - name: Verify (typecheck, tests & bench-app)
        run: bun run verify

      - name: Build docs static site
        run: |
          cd docs
          bun install --silent --prefer-offline
          bun run build

      - name: Publish to Forgejo npm registry
        run: |
          trap 'rm -f ~/.npmrc' EXIT
          echo "@kaynooo:registry=https://git.kaynooo.fr/api/packages/kaynooo/npm/" > ~/.npmrc
          echo "@kayjs:registry=https://git.kaynooo.fr/api/packages/kaynooo/npm/" >> ~/.npmrc
          echo "//git.kaynooo.fr/api/packages/kaynooo/npm/:_authToken=${PACKAGE_TOKEN}" >> ~/.npmrc
          sh scripts/publish-packages.sh https://git.kaynooo.fr/api/packages/kaynooo/npm/
        env:
          PACKAGE_TOKEN: ${{ secrets.PACKAGE_TOKEN }}

      - name: Publish to npm (staged)
        run: |
          if [ -z "$NPM_STAGE_TOKEN" ]; then
            echo "NPM_STAGE_TOKEN is not set, npm is skipped"
            exit 0
          fi
          if ! command -v npm >/dev/null 2>&1 || ! npm stage --help >/dev/null 2>&1; then
            bun add -g npm@latest
            export PATH="$HOME/.bun/bin:$PATH"
          fi
          trap 'rm -f ~/.npmrc' EXIT
          echo "@kayjs:registry=https://registry.npmjs.org/" > ~/.npmrc
          echo "//registry.npmjs.org/:_authToken=${NPM_STAGE_TOKEN}" >> ~/.npmrc
          sh scripts/publish-packages.sh --stage https://registry.npmjs.org/
        env:
          NPM_STAGE_TOKEN: ${{ secrets.NPM_STAGE_TOKEN }}
