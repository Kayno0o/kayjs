[test]
root = "./tests"
# One run at a time in a checkout, as its runs build into the same .kay and fixtures; the browser and the sites of kay/test close once the tests ran, as kay/test/preload has it; a file that leaves a process of its own running fails, as tests/leaks.ts has it; every run takes the suite's timeout.
preload = [
  "./tests/one-run.ts",
  "./tests/timeout.ts",
  "./src/test/browser.ts",
  "./src/test/sites.ts",
  "./tests/leaks.ts"
]

[install]
# One node_modules at the root, as before the packages joined: kay resolves to this checkout under one path, its types with it.
linker = "hoisted"
