name: Tests

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
  pull_request:
    paths-ignore:
      - '**.md'
  workflow_dispatch:

permissions:
  contents: read

# Pinned so the cache step and bun agree on one folder, whatever HOME the runner image sets.
# CI is set outright, as the tests that fail instead of skipping without a browser or a database read it, and a runner not exporting it would skip them silently.
env:
  BUN_INSTALL_CACHE_DIR: /tmp/bun-cache
  CI: 'true'

# A group of the commit alone: Forgejo then neither cancels a run on a newer push (its default without a block) nor queues it behind the others, so each waits for the runner alone and the latest job ends a stale one in seconds. One group for the branch queued every run behind any older one left pending, and on Forgejo 16 that held runs waiting with the runner idle.
concurrency:
  group: tests-${{ github.sha }}
  cancel-in-progress: false

jobs:
  # A push's run tests every commit since the last one passed, so a run whose commit is no longer the branch's head leaves its tests to the newer push's.
  latest:
    runs-on: alpine
    timeout-minutes: 2
    outputs:
      current: ${{ steps.head.outputs.current }}

    steps:
      - name: Find whether a newer push is queued behind this run
        id: head
        run: |
          current=true
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            # An API that does not answer leaves the tests to run.
            head=$(curl -sf --max-time 10 -H "Authorization: token $TOKEN" "$API/repos/$GITHUB_REPOSITORY/branches/$GITHUB_REF_NAME" | jq -r '.commit.id // empty' || true)
            # Only a head with a run of its own: a push touching only .md files moves the branch and starts none.
            if [ -n "$head" ] && [ "$head" != "$GITHUB_SHA" ] && curl -sf --max-time 10 -H "Authorization: token $TOKEN" "$API/repos/$GITHUB_REPOSITORY/commits/$head/status" | jq -e '[.statuses[]? | select(.context | startswith("Tests / "))] | length > 0' >/dev/null; then
              echo "Main moved on to $head, whose run tests this commit too"
              current=false
            fi
          fi
          echo "current=$current" >> "$GITHUB_OUTPUT"
        env:
          API: ${{ github.server_url }}/api/v1
          TOKEN: ${{ secrets.GITHUB_TOKEN }}

  test:
    needs: latest
    # A release's version commit, `v1.2.3`, pushed alone, is tested by the publish workflow its tag starts, on the same tree; no other commit title starts with a `v`. Code commits pushed along with it still get the steps only this workflow runs.
    if: needs.latest.outputs.current == 'true' && (github.event_name != 'push' || !startsWith(github.event.head_commit.message, 'v') || github.event.commits[1] != null)
    runs-on: alpine
    # Well past the slowest run so far (about 10 minutes), so a hung run frees the queue behind it.
    timeout-minutes: 15

    steps:
      # Deep enough to find the last commit these tests passed.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 50

      # Since the last commit these tests passed, by the test job's own status, which reads `skipped` on a run left to a newer push's: that run tests every commit since then. A push reaching no passed commit counts as changing everything.
      - name: Find what changed since the last tested commit
        id: changed
        run: |
          verdict() {
            curl -sf --max-time 10 -H "Authorization: token $TOKEN" "$API/repos/$GITHUB_REPOSITORY/commits/$1/status" | jq -r '[.statuses[]? | select(.context | startswith("Tests / test ")) | .status // .state] | first // empty' || true
          }
          base=
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            for commit in $(git rev-list --max-count=49 HEAD^); do
              if [ "$(verdict "$commit")" = success ]; then base=$commit; break; fi
            done
          fi
          echo "Last tested commit: ${base:-none}"
          if [ -n "$base" ] && git diff --quiet "$base" HEAD -- bench/ bun.lock; then
            echo "bench=false" >> "$GITHUB_OUTPUT"
          else
            echo "bench=true" >> "$GITHUB_OUTPUT"
          fi
        env:
          API: ${{ github.server_url }}/api/v1
          TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # actions/cache archives with GNU tar's --posix, which the image's BusyBox tar refuses, so the cache was never saved.
      - name: Install GNU tar
        run: apk info -e tar >/dev/null || apk add --no-cache tar

      # A lockfile change still restores the closest older cache, so bun only fetches the packages that moved.
      - name: Cache bun packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ env.BUN_INSTALL_CACHE_DIR }}
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock', 'bench/apps/*/bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      # The apps the benchmark compares against are packages of their own, which the type-aware lint and bench:check read.
      - name: Install dependencies
        run: |
          bun install --silent --frozen-lockfile
          bun install --silent --frozen-lockfile --cwd bench/apps/solid
          bun install --silent --frozen-lockfile --cwd bench/apps/svelte

      # Read only by their own checks below, which the lint leaves out.
      - name: Install the other frameworks' benchmark apps
        if: steps.changed.outputs.bench == 'true'
        run: |
          bun install --silent --frozen-lockfile --cwd bench/apps/astro
          bun install --silent --frozen-lockfile --cwd bench/apps/next
          bun install --silent --frozen-lockfile --cwd bench/apps/nuxt

      - name: Lint
        run: bun run lint

      - name: Check
        run: bun run check

      # For the tests driving pages through `kay/test` in a real browser, which Bun.WebView finds through BUN_CHROME_PATH.
      - name: Install Chromium
        run: |
          apk info -e chromium ttf-freefont >/dev/null || apk add --no-cache chromium ttf-freefont
          echo "BUN_CHROME_PATH=$(command -v chromium || command -v chromium-browser)" >> "$GITHUB_ENV"

      # The app template's own tests copy a database per test file, here on the cluster the runner image holds, started as pg-orm's CI starts it.
      - name: Start PostgreSQL
        run: |
          mkdir -p /run/postgresql
          chown postgres:postgres /run/postgresql
          su postgres -c "pg_ctl -D /var/lib/postgresql/data -o '-c listen_addresses=127.0.0.1 -c unix_socket_directories=/run/postgresql' -w start"
          su postgres -c "psql -c \"CREATE USER test WITH PASSWORD 'test' SUPERUSER;\""
          echo "TEST_DATABASE_URL=postgres://test:test@127.0.0.1:5432/kay_app_test" >> "$GITHUB_ENV"
          su postgres -c "createdb -O test kayjs_auth_test"
          echo "KAYJS_AUTH_TEST_DATABASE_URL=postgres://test:test@127.0.0.1:5432/kayjs_auth_test" >> "$GITHUB_ENV"

      # Every test file in this one checkout, the slowest first by tests/timings.json, on half the host's 12 cores: a worker per core held the whole machine the runner shares.
      - name: Tests
        run: bun run test --parallel=6

      # The lint above already ran each library's own, one process each, as one holding every library's type-aware program runs out of memory.
      - name: Check and test the libraries
        run: |
          for dir in packages/*/; do
            echo "$dir"
            (cd "$dir" && bun run check && bun run test) || exit 1
          done
        env:
          # kayjs-auth refuses to skip its pg store's tests for want of a database.
          KAYJS_AUTH_REQUIRE_DATABASE: '1'

      - name: Check kay's benchmark app
        run: bun run bench:check:kay

      # They follow their own frameworks, not kay, so only a change to them or the lockfile can break them.
      - name: Check the other frameworks' benchmark apps
        if: steps.changed.outputs.bench == 'true'
        run: bun run bench:check:apps

      - name: Check that kay's bench pages leave hydration markers to islands
        run: bun test ./bench -t 'leave hydration markers'
