# Run from the root of kay's repository: docker compose -f docs/compose.yaml up -d --build
name: kay-docs
services:
  docs:
    build:
      context: ..
      dockerfile: docs/Dockerfile
      # The tracker's tag is part of the prerendered pages, so the build needs the id the server runs with.
      args:
        UMAMI_WEBSITE_ID: ${UMAMI_WEBSITE_ID:-}
    restart: unless-stopped
    # On the loopback only: `proxy: true` trusts X-Forwarded-For, so visitors reach the server through nginx alone.
    ports:
      - 127.0.0.1:3649:3649
    # The chat's OPENAI_API_KEY, AI_BASE_URL and AI_MODEL, see README.md; without the file the site serves and the chat says it is not available.
    env_file:
      - path: .env
        required: false
    # Umami, shared with other apps by its own stack in /opt/web/apps/umami, is reached as `umami` on that stack's network.
    networks:
      - default
      - umami
    # The chat's daily counts, kept over a restart in the checkout's gitignored docs/data/, which must exist and belong to the uid the daemon's userns-remap maps `bun` (1000) to.
    volumes:
      - type: bind
        source: ./data
        target: /kay/docs/data
        bind:
          create_host_path: false
networks:
  umami:
    external: true
