# Run from the root of kay's repository: docker compose -f examples/noticeboard/compose.prod.yaml up -d
services:
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: app
      # Letters and digits only: it goes into DATABASE_URL below as it is.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: noticeboard
    volumes:
      - db:/var/lib/postgresql
    healthcheck:
      test: [CMD-SHELL, pg_isready -h 127.0.0.1 -U app]
      interval: 5s
      retries: 10

  # Applies the pending migrations before the app starts, from the build stage, which holds them and the pg-orm command.
  migrate:
    build:
      context: ../..
      dockerfile: examples/noticeboard/Dockerfile
      target: build
    command: [bun, run, db:migrate]
    environment:
      DATABASE_URL: postgres://app:${POSTGRES_PASSWORD}@db:5432/noticeboard
    depends_on:
      db:
        condition: service_healthy

  app:
    build:
      context: ../..
      dockerfile: examples/noticeboard/Dockerfile
    restart: unless-stopped
    ports:
      - 3000:3000
    environment:
      SESSION_SECRET: ${SESSION_SECRET:?set SESSION_SECRET}
      AUTH_SECRET: ${AUTH_SECRET:?set AUTH_SECRET}
      DATABASE_URL: postgres://app:${POSTGRES_PASSWORD}@db:5432/noticeboard
      SITE_URL: ${SITE_URL:?set SITE_URL, the public origin mailed links start with}
      SMTP_HOST: ${SMTP_HOST:?set SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT:-465}
      # Drop both for a mail server that needs no login.
      SMTP_USER: ${SMTP_USER:?set SMTP_USER}
      SMTP_PASS: ${SMTP_PASS:?set SMTP_PASS}
    volumes:
      - data:/app/data
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  db:
  data:
