name: Publish to Forgejo Package Registry

permissions:
  contents: read

on:
  push:
    tags:
      - 'v*'

# Pinned so the cache step and bun agree on one folder, whatever HOME the runner image sets.
env:
  BUN_INSTALL_CACHE_DIR: /tmp/bun-cache

jobs:
  publish:
    runs-on: alpine
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # The cluster is baked into the runner image, so the pg store's tests run here rather than skip; /run is tmpfs, so its socket directory is made each time.
      - name: Start PostgreSQL
        run: |
          install -d -o postgres -g postgres /run/postgresql
          su postgres -c "pg_ctl -D /var/lib/postgresql/data -w start"
          su postgres -c "createdb kayjs_auth_test"

      # A lockfile change still restores the closest older cache, so bun only fetches the packages that moved.
      - name: Cache bun packages
        uses: actions/cache@v4
        with:
          path: ${{ env.BUN_INSTALL_CACHE_DIR }}
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - name: Install project deps
        run: bun install --silent --frozen-lockfile

      # A tag that fails its own checks never reaches the registry.
      - name: Lint
        run: bun run lint

      - name: Check
        run: bun run check

      - name: Tests
        run: bun test
        env:
          KAYJS_AUTH_TEST_DATABASE_URL: postgres://postgres@127.0.0.1:5432/kayjs_auth_test
          # Refuses to skip the pg store's tests for want of a database.
          KAYJS_AUTH_REQUIRE_DATABASE: '1'

      - name: Configure npm authentication
        run: |
          echo "@kaynooo:registry=https://git.kaynooo.fr/api/packages/kaynooo/npm/" > ~/.npmrc
          echo "//git.kaynooo.fr/api/packages/kaynooo/npm/:_authToken=${PACKAGE_TOKEN}" >> ~/.npmrc
        env:
          PACKAGE_TOKEN: ${{ secrets.PACKAGE_TOKEN }}

      # prepack writes the declarations under types/ that the exports point at.
      - name: Publish to Forgejo npm registry
        run: bun publish --access public
        env:
          PACKAGE_TOKEN: ${{ secrets.PACKAGE_TOKEN }}

      - name: Generate changelog
        run: bun x @kaynooo/changelogitea@latest
        env:
          GITHUB_TOKEN: ${{secrets.GITHUB_TOKEN}}
