name: Tests

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
  pull_request:
    paths-ignore:
      - '**.md'
  workflow_dispatch:

# Pinned so the cache step and bun agree on one folder, whatever HOME the runner image sets.
env:
  BUN_INSTALL_CACHE_DIR: /tmp/bun-cache

jobs:
  test:
    runs-on: alpine
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      # A lockfile change still restores the closest older cache, so bun only fetches the packages that moved.
      - name: Cache bun packages
        uses: actions/cache@v4
        with:
          path: ${{ env.BUN_INSTALL_CACHE_DIR }}
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - name: Install dependencies
        run: bun install --silent --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Check
        run: bun run check

      # For the tests driving pages through `kay/test` in a real browser, which Bun.WebView finds through BUN_CHROME_PATH.
      - name: Install Chromium
        run: |
          apk add --no-cache chromium ttf-freefont
          echo "BUN_CHROME_PATH=$(command -v chromium || command -v chromium-browser)" >> "$GITHUB_ENV"

      # The app template's own tests copy a database per test file, here on the cluster the runner image holds, started as pg-orm's CI starts it.
      - name: Start PostgreSQL
        run: |
          mkdir -p /run/postgresql
          chown postgres:postgres /run/postgresql
          su postgres -c "pg_ctl -D /var/lib/postgresql/data -o '-c listen_addresses=127.0.0.1 -c unix_socket_directories=/run/postgresql' -w start"
          su postgres -c "psql -c \"CREATE USER test WITH PASSWORD 'test' SUPERUSER;\""
          echo "TEST_DATABASE_URL=postgres://test:test@127.0.0.1:5432/kay_app_test" >> "$GITHUB_ENV"

      - name: Tests
        run: bun test

      # The Solid and Svelte apps the benchmark compares against are packages of their own.
      - name: Check the benchmark apps
        run: |
          bun install --silent --frozen-lockfile --cwd bench/apps/solid
          bun install --silent --frozen-lockfile --cwd bench/apps/svelte
          bun run bench:check

      - name: Check that kay's bench pages leave hydration markers to islands
        run: bun test ./bench -t 'leave hydration markers'
